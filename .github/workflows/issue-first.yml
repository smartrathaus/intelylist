name: Issue-first workflow

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  linked-issue:
    name: Require an existing issue
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue reference and status
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const matches = [...body.matchAll(/(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)\s+#(\d+)/gi)];
            const numbers = [...new Set(matches.map((match) => Number(match[1])))];
            if (numbers.length === 0) {
              core.setFailed("Jeder Pull Request muss ein bestehendes GitHub Issue mit 'Closes #123' referenzieren. Bitte zuerst ein Issue anlegen.");
              return;
            }

            for (const number of numbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
              });
              if (issue.pull_request) {
                core.setFailed(`#${number} ist ein Pull Request, kein fachliches Issue.`);
                return;
              }
              if (issue.state !== "open") {
                core.setFailed(`Das verknüpfte Issue #${number} ist nicht mehr offen. Bitte klären, ob ein neues Issue erforderlich ist.`);
                return;
              }
            }
            core.info(`Verknüpfte offene Issues geprüft: ${numbers.map((n) => "#" + n).join(", ")}`);
